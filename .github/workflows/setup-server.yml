name: Setup Server

# One-time (idempotent) provisioning of the Alibaba Cloud server.
# Trigger manually from the Actions tab after setting the SERVER_HOST,
# SERVER_USER and SERVER_SSH_KEY repository secrets.

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy setup script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/server-setup.sh"
          target: "/tmp/"
          strip_components: 1

      - name: Run setup script
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            bash /tmp/server-setup.sh
            rm -f /tmp/server-setup.sh
